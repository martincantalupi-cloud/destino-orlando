name: Bajar fotos de Wikimedia a la web

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bajar-fotos
  cancel-in-progress: false

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bajar fotos, reemplazar links y armar créditos
        run: python scripts/bajar_fotos.py

      - name: Guardar cambios en main
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A web scripts
          if git diff --cached --quiet; then
            echo "No hubo cambios."
          else
            git commit -m "Fotos de Wikimedia guardadas en la web, con créditos"
            git push
          fi
