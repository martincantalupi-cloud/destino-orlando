name: Preparar publicación (rama publicado)

# Copia el contenido de web/ a la rama "publicado", que es la que lee Hostinger.
on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_run:
    workflows: ["Bajar fotos de Wikimedia a la web"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Armar rama publicado con el contenido de web/
        run: |
          cp -a web /tmp/sitio
          cd /tmp/sitio
          git init -q -b publicado
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicación desde main ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" publicado
